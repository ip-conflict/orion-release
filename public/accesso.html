<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso per l'emergenza - ORION</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/componenti.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        /* La pagina che si apre inquadrando il QR dell'accesso esterno: di
         * solito sul telefono, in piedi davanti al COC. Poche parole, pulsanti
         * grandi. */
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px 16px; box-sizing: border-box;
            background: var(--bg-color, #f4f5f7); color: var(--text-color, #111);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .scheda {
            width: 100%; max-width: 440px; background: var(--surface-color, #fff);
            border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 26px 22px; box-sizing: border-box;
        }
        .scheda img.logo { height: 56px; width: auto; display: block; margin: 0 auto 12px; }
        h1 { font-size: 1.3rem; margin: 0 0 6px; text-align: center; }
        p { line-height: 1.5; margin: 0 0 12px; }
        .piccolo { font-size: .88rem; opacity: .8; }
        .pulsante {
            display: block; width: 100%; box-sizing: border-box; text-align: center; text-decoration: none;
            padding: 14px 16px; border-radius: 10px; font-weight: 700; font-size: 1rem; margin: 10px 0 0;
            background: #2563eb; color: #fff; border: none; cursor: pointer;
        }
        .pulsante.secondario { background: transparent; color: inherit; border: 1px solid var(--border-color, #ccc); }
        .app { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-color, #ddd); }
        .app ol { padding-left: 20px; margin: 8px 0; line-height: 1.6; }
        .errore { color: var(--danger-text); text-align: center; }
    </style>
</head>
<body>
    <main class="scheda">
        <img id="logo" class="logo" src="/logo.png" alt="" hidden>
        <h1 id="titolo">Accesso in corso…</h1>
        <div id="contenuto"></div>
    </main>
    <script src="/vendor/js-cookie/js.cookie.min.js"></script>
    <script src="/js/accesso.js"></script>
</body>
</html>
