<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imposta Password - ORION</title>
  <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/componenti.css">
  <link rel="stylesheet" href="/css/centro-operativo.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <style>
      /* Override per farla sembrare una card moderna come nel profilo */
      .login-box {
          border-top: 5px solid #10b981 !important;
          border-radius: 12px;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
          padding: 40px;
      }
      .login-box h2 { margin-bottom: 10px !important; }
      .input-modern {
          width: 100%; padding: 12px !important; border-radius: 6px !important;
          border: 1px solid var(--border-color) !important;
          background: var(--bg-color) !important; color: var(--text-color) !important;
          box-sizing: border-box; margin-bottom: 15px !important;
      }
      .input-modern:focus { border-color: #10b981 !important; outline: none; box-shadow: 0 0 0 3px rgba(16,185,129,0.2) !important;}
      .btn-modern {
          background: linear-gradient(135deg, #10b981, #059669) !important;
          color: white !important; border-radius: 50px !important; padding: 12px 24px !important;
          font-size: 1rem !important; font-weight: 600 !important; border: none; width: 100%;
          box-shadow: 0 4px 6px rgba(16,185,129,0.3); transition: transform 0.1s; cursor: pointer;
      }
      .btn-modern:hover { transform: translateY(-2px); }
  </style>
</head>
<body style="background: var(--bg-color);">
  <div class="login-container">
    <div class="login-box">
      <form id="reset-password-form">
        <h2 style="display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--text-color);">
            Scegli la tua password
        </h2>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px;">È la password con cui entrerai in ORION, dal computer e dall'app. Scrivila due volte uguale.</p>
        
        <div style="text-align: left;">
            <label for="new-password" style="font-weight: 600; font-size: 0.9rem; color: var(--text-color); display: block; margin-bottom: 5px;">Nuova password</label>
            <input type="password" id="new-password" class="input-modern"  required minlength="12">
            
            <label for="confirm-password" style="font-weight: 600; font-size: 0.9rem; color: var(--text-color); display: block; margin-bottom: 5px;">Ripeti la password</label>
            <input type="password" id="confirm-password" class="input-modern"  required minlength="12">
        </div>

        <div style="background: rgba(59, 130, 246, 0.05); border-left: 4px solid #3b82f6; padding: 12px 15px; border-radius: 6px; margin-bottom: 25px; text-align: left;">
            <p style="margin: 0 0 5px 0; font-size: 0.85rem; color: var(--text-color); line-height: 1.5;">
                <i class="fas fa-info-circle" style="color: var(--info-text);"></i> <strong>Requisiti minimi:</strong><br>
                Almeno 12 caratteri, con almeno una lettera maiuscola, una minuscola, un numero e un simbolo (per esempio ! ? # @).
            </p>
            <p style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">
                Per esempio: <code style="background: var(--surface-color); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-color);">Pr0t3z10n3C1v1l3!</code>
            </p>
        </div>
        
        <button type="submit" class="button-style btn-modern">Salva la password</button>
        <p id="reset-message" style="margin-top: 20px; font-weight: bold;"></p>
      </form>
    </div>
  </div>

  <script src="/js/reset-password.js"></script>
</body>
</html>
